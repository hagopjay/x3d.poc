name: Build and deploy the demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the site
        run: bash tools/assemble.sh site

      - name: Smoke test (each page must load its scene)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          (cd site && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          node tools/smoke.js http://127.0.0.1:8766 index.html gobbler.html materials.html drillfield.html spec-questions.html two-renderers.html shroud/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
