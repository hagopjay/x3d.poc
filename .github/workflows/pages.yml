name: Build and deploy the demos

on:
  # The Pages environment only accepts deployments from site/pages-actions (see Settings > Environments), and
  # Pages is sourced from that branch, so that is the branch to build and deploy. Pull requests into it get the
  # build and smoke test but never deploy.
  push:
    branches: [site/pages-actions]
  pull_request:
    branches: [site/pages-actions]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # One group per ref: a pull request run must not cancel a deployment in progress on the branch.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Backstop: a wedged browser must fail the run, not hold a runner for hours (one smoke test once ran 2h41m before being cancelled).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assemble the site
        run: bash tools/assemble.sh site

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Smoke test (each page must load its scene)
        env:
          # Playwright's full Chromium in new headless mode. The default chromium-headless-shell build segfaults on index.html
          # and gobbler.html on these runners and leaves the page hanging; see the header of tools/smoke.js.
          SMOKE_BROWSER: chromium
        run: |
          (cd site && python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 2
          timeout --kill-after=10 900 node tools/smoke.js http://127.0.0.1:8766 index.html gobbler.html materials.html drillfield.html spec-questions.html two-renderers.html shroud/index.html

      # A browser crash shows up here as a segfault line.
      - name: Kernel log after a failed smoke test
        if: failure()
        continue-on-error: true
        run: sudo dmesg | tail -30

      # Pull requests from forks get a read-only token, so only the build and smoke test run for them.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
